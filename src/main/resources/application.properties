server.port=8081

#h2 数据库基础配置
## TRACE_LEVEL_FILE=0 关闭 H2 内部 trace 文件（vmq.trace.db），错误仍通过应用日志输出
spring.datasource.url=jdbc:h2:~/vmq;TRACE_LEVEL_FILE=0;LOCK_TIMEOUT=10000
spring.datasource.username=vmq
spring.datasource.password=vmq
spring.datasource.driver-class-name=org.h2.Driver

# 连接池配置（内嵌 H2、单机低并发，无需维持过多连接）
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

#设置 jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#h2 数据库控制台设置（生产环境应禁用）
spring.h2.console.settings.web-allow-others=false
spring.h2.console.path=/h2-console
spring.h2.console.enabled=false


spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
