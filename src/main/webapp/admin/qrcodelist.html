<style>
    /* 1. 让单元格高度自适应，避免内容被截断 */
    .layui-table-cell {
        height: auto !important;
        overflow: visible !important;
        padding: 8px 15px !important; /* 增加上下左右内边距，解决拥挤感 */
        line-height: 1.6;
    }

    /* 2. 图片样式优化：限制最大宽度但允许弹性缩放 */
    .layui-table img.qr-img {
        max-width: 180px;
        min-width: 80px;
        width: 100%; /* 关键：让图片在列宽范围内自适应 */
        display: block;
        margin: 0 auto; /* 居中显示 */
        border-radius: 4px;
    }

    /* 3. 修复layui固定列可能导致的错位问题 */
    .layui-table-fixed { box-shadow: none; }
</style>

<table id="demo" lay-filter="test"></table>

<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script>
    var qrType = window.qrType || 1;
    var myTable;

    layui.use(['form', 'table'], function () {
        var table = layui.table, form = layui.form, $ = layui.jquery;

        myTable = table.render({
            elem: '#demo',
            height: 'full-130',
            url: '/admin/getPayQrcodes',
            where: { type: qrType },
            page: true,
            limit: 20,
            // ★ 关键配置：开启单元格自动换行和宽度自适应
            cellMinWidth: 80,
            even: true, // 隔行变色，视觉上更宽松

            parseData: function (res) {
                var ok = (res.code == 0 || res.code == 1);
                return { "code": ok ? 0 : -1, "msg": res.msg || "", "count": res.count || 0, "data": res.data || [] };
            },

            cols: [[
                {type: 'numbers', title: '序号', width: 70, align: 'center'},

                // ★ 二维码列：去掉固定width，改用minWidth让它占据剩余空间
                {title: '二维码', minWidth: 220, maxWidth: 300, align: 'center', templet: function (d) {
                        if (!d.payUrl && !d.url && !d.qrcode) return '<span style="color:#999;padding:10px;">无链接</span>';
                        var u = d.payUrl || d.url || d.qrcode;
                        return '<img class="qr-img" src="/enQrcode?url=' + encodeURIComponent(u) + '" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span style=color:red>生成失败</span>\';" />';
                    }},

                // ★ 金额和类型：使用minWidth代替固定width
                {field: 'price', title: '金额', minWidth: 100, align: 'center'},
                {field: 'type', title: '类型', minWidth: 100, align: 'center', templet: function(d){
                        var color = d.type==2 ? '#1677ff' : '#07c160';
                        return '<span style="color:'+color+';font-weight:bold;">'+(d.type==2?'支付宝':'微信')+'</span>';
                    }},

                // 操作列保持固定宽度即可
                {title: '操作', width: 100, align: 'center', toolbar: '#barDemo'}
            ]]
        });

        table.on('tool(test)', function (obj) {
            var data = obj.data, layEvent = obj.event;
            if (layEvent === 'del') {
                layer.confirm('要删除该二维码么？', function (index) {
                    $.post("/admin/delPayQrcode", { id: data.id }, function (res) {
                        layer.msg(res.msg || '已删除');
                        if (res.code == 1 || res.code == 0) {
                            obj.del();
                            myTable.reload();
                        }
                    });
                    layer.close(index);
                });
            }
        });

        form.render();

        // ★ 窗口大小改变时重绘表格，保证始终自适应
        $(window).resize(function(){
            myTable.resize();
        });
    });
</script>
