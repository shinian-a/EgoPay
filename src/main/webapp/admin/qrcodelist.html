<style>
    .layui-table-cell { height: auto; overflow: visible; }
    .layui-table img { max-width: 200px; display: block; }
</style>

<table id="demo" lay-filter="test"></table>

<script type="text/html" id="barDemo">
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script>
    var qrType = window.qrType || 1;
    var myTable;

    layui.use(['form', 'table'], function () {
        var table = layui.table, form = layui.form, $ = layui.jquery;

        myTable = table.render({
            elem: '#demo',
            height: 'full-130',
            url: '/admin/getPayQrcodes',
            where: { type: qrType },
            page: true,
            limit: 20,
            parseData: function (res) {
                // ★兼容后端 code=1 当成功的情况
                var ok = (res.code == 0 || res.code == 1);
                return { "code": ok ? 0 : -1, "msg": res.msg || "", "count": res.count || 0, "data": res.data || [] };
            },
            done: function (res, curr, count) {
                console.log('列表接口返回:', res);
                if (res.data && res.data[0]) console.log('字段名:', Object.keys(res.data[0]));
            },
            cols: [[
                {type: 'numbers', title: '序号', width: 60},
                {title: '二维码', width: 230, templet: function (d) {
                        if (!d.payUrl && !d.url && !d.qrcode) return '<span style="color:#999">无链接</span>';
                        var u = d.payUrl || d.url || d.qrcode;
                        return '<img src="/enQrcode?url=' + encodeURIComponent(u) + '" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span style=color:red>生成失败</span>\';" />';
                    }},
                {field: 'price', title: '金额', width: 120},
                {field: 'type', title: '类型', width: 100, templet: function(d){ return d.type==2?'支付宝':'微信'; }},
                {title: '操作', width: 80, align: 'center', toolbar: '#barDemo'}
            ]]
        });

        table.on('tool(test)', function (obj) {
            var data = obj.data, layEvent = obj.event;
            if (layEvent === 'del') {
                layer.confirm('要删除该二维码么？', function (index) {
                    $.post("/admin/delPayQrcode", { id: data.id }, function (res) {
                        layer.msg(res.msg || '已删除');
                        if (res.code == 1 || res.code == 0) {
                            obj.del();
                            myTable.reload();
                        }
                    });
                    layer.close(index);
                });
            }
        });

        form.render();
    });
</script>
